name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - name: Install Python formatter
        run: |
          uv tool install 'ruff==0.16.6'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - run: bun run check
      - run: bun run build
      - run: bun run test:runtimes
      - run: bun run test:atlas
